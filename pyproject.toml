[tool.black]
line-length = 80
target-version = ['py311']
exclude = '/.*(__pycache__).*/'

[build-system]
requires = ["scikit_build_core", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = false
build-dir = "build/{wheel_tag}"

[[tool.scikit-build.overrides]]
if.failed = true
wheel.cmake = false

[tool.scikit-build.sdist]
exclude = ["*"]
include = [
    "type_enforced/*.py",
    "type_enforced/cpp/*",
    "pyproject.toml",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]

[project]
name = "type_enforced"
version = "2.11.0"
description = "A dependency free type enforcer for python type annotations"
authors = [
    {name="Connor Makowski", email="conmak@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    'License :: OSI Approved :: MIT License',
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "autoflake>=2.3.1",
    "black>=25.1.0",
    "build>=1.2.2",
    "nox>=2026.4.10",
    "nox-uv>=0.8.0",
    "pdoc>=15.0.1",
    "twine>=6.1.0",
    "pydantic==2.13.4",
    "beartype==0.22.9",
    "typeguard==4.6.0",
    "msgspec>=0.21.1; implementation_name != 'pypy'",
    "cattrs>=26.1.0",
    "scikit-build-core>=1.0.3",
    "nanobind>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/connor-makowski/type_enforced"
"Bug Tracker" = "https://github.com/connor-makowski/type_enforced/issues"
"Documentation" = "https://connor-makowski.github.io/type_enforced/type_enforced/enforcer.html"

[tool.uv]
no-build-isolation-package = []

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*.py"]
pythonpath = ["."]
