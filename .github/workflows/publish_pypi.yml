name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name of the release to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish package to PyPI via Trusted Publishing
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Mandatory for PyPI OIDC trusted publishing
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "Error: No tag name provided."
            exit 1
          fi
          echo "Downloading assets for release tag '$TAG'..."
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist

      - name: List downloaded packages
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
