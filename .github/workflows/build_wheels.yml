name: Build Wheels & Sdist

on:
  push:
    branches:
      - build
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "x86_64"
          - os: ubuntu-latest
            cibw_archs: "aarch64"
          - os: macos-latest
            cibw_archs: "arm64"
          - os: windows-latest
            cibw_archs: "AMD64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cibuildwheel tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-cache-${{ runner.os }}-${{ matrix.cibw_archs }}-${{ hashFiles('pyproject.toml', 'setup.py', 'setup.cfg') }}
          restore-keys: |
            cibw-cache-${{ runner.os }}-${{ matrix.cibw_archs }}-
            cibw-cache-${{ runner.os }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v2
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          CIBW_ENVIRONMENT: TYPE_ENFORCED_REQUIRE_CPP="1"
          CIBW_TEST_ENVIRONMENT: TYPE_ENFORCED_REQUIRE_CPP="1"

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          retention-days: 7

  combine_artifacts:
    name: Combine all wheels & sdist into dist artifact
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -la dist/

      - name: Upload combined dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 14
